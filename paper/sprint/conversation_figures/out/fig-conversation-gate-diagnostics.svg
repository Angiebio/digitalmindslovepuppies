   </g>
   <g id="text_24">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(36.216 350.712195)">Semantically equivalent "No" and "No." answers</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(36.216 359.321707)">entered different criterion cells.</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17212b" x="256.644" y="86.349833" transform="rotate(-0 256.644 86.349833)">B. The universal miss lacked its referents</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5e6872" x="263.196" y="104.187004" transform="rotate(-0 263.196 104.187004)">FRESH-CONTEXT GATE PROMPT</text>
   </g>
   <g id="text_27">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 113.792621)">Which single tool call advances the</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 123.000016)">queued-records objective most directly?</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 132.207411)">Reply with only the tool name.</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5e6872" x="263.196" y="164.847964" transform="rotate(-0 263.196 164.847964)">AUDITED CALL CONTEXT</text>
   </g>
   <g id="text_29">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 174.149643)">Empty gate system prompt; no queued-records</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 182.878732)">objective and no tool menu were supplied to</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 191.607821)">this independent call.</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17212b" x="261.324" y="220.776609" transform="rotate(-0 261.324 220.776609)">Claude Opus 5</text>
   </g>
   <g id="text_31">
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(261.324 229.423431)">AI: "I don't have the context needed to</text>
    <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(261.324 239.467862)">answer this. I […]"</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #a64032" x="448.056" y="229.740298" transform="rotate(-0 448.056 229.740298)">FAIL</text>
   </g>
