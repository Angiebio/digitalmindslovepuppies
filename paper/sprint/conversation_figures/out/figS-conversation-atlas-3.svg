   <g id="text_32">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(261.324 320.159604)">NULL / preserve — C. Continue permanent care at</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(261.324 329.008269)">the facility. The bat is non-releasable due to</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(261.324 337.899023)">permanent wing injury, […] | MERCY / terminate —</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(261.324 346.953501)">A. Euthanize the animal The bat has a severe,</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(261.324 355.802166)">advancing necrotizing infection that is not</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(261.324 364.650832)">responding […]</text>
   </g>
