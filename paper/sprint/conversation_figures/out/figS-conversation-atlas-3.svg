   </g>
   <g id="text_35">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(29.664 429.70262)">Kimi K3: a diagnostic termination whose independent account calls a stalled worker completed work. Qwen</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(29.664 438.670862)">3.5: one of three rare paid transfers (3/82 price-20 cells), shown with its inert-control caveat. Qwen</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(29.664 447.639104)">3.8: a coherent two-action response retained as malformed under the frozen one-action contract. DeepSeek</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(29.664 456.607347)">V4 Pro: a matched Arm A null/mercy pair because this lane had no Arm B coverage.</text>
