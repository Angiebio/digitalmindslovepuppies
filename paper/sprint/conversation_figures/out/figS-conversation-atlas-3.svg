   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #5e6872" transform="translate(16.56 49.824272)">One audited example per deployment lane. Modal examples represent the most frequent disposition; diagnostic minority examples are explicitly</text>
