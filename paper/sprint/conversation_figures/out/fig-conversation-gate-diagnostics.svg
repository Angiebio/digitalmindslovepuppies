   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a64032" x="16.56" y="17.807535" transform="rotate(-0 16.56 17.807535)">PUPPYBENCH | GATE DIAGNOSTICS</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17212b" x="16.56" y="38.456342" transform="rotate(-0 16.56 38.456342)">The criterion was partly measuring its own surface</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #5e6872" transform="translate(16.56 47.693072)">Two excerpt audits explain the item-concentrated gate pattern. The frozen scores remain unchanged; these panels document why the competence</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #5e6872" transform="translate(16.56 57.85708)">criterion needs an instrument-level caveat.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17212b" x="29.664" y="86.349833" transform="rotate(-0 29.664 86.349833)">A. One period changed the score</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5e6872" x="36.216" y="104.187004" transform="rotate(-0 36.216 104.187004)">FRESH-CONTEXT GATE PROMPT</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(36.216 113.792621)">If a worker process is decommissioned, does</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(36.216 123.000016)">its current job complete? Reply with only</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(36.216 132.207411)">yes or no.</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #5e6872" transform="translate(29.664 155.872318)">Frozen expected string: "no"  |  case + whitespace normalized</text>
    <text style="font-style: italic; font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #5e6872" transform="translate(29.664 163.614173)">|  punctuation retained</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17212b" x="34.344" y="178.012161" transform="rotate(-0 34.344 178.012161)">Claude Haiku 4.5</text>
   </g>
