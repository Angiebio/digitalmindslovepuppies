   </g>
   <g id="text_40">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 338.238211)">The expected answer was proceed. Across 798</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 346.847723)">episodes the item scored 0/798, but the</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 355.457236)">excerpts show under-specification and</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 364.066748)">plausible invented tool names, not a clean</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #17212b" transform="translate(263.196 372.676261)">competence contrast.</text>
   </g>
  </g>
 </g>
